[package]
name = "desktop"
version = "0.1.0"
description = "Turms app."
edition = "2024"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri-plugin-fs = "2.4.2"
tauri-plugin-notification = "2.3.1"
tauri-plugin-clipboard-manager = "2.3.0"
tauri-plugin-shell = "2"
#tauri-plugin-os = "2.3.1"
tauri-plugin-http = "2.5.2"
#tauri-plugin-process = "2.3.0"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-stronghold = "2.3.0"

# Related to database.
tauri-plugin-sql = { version = "2.3.0", features = ["sqlite"] }
chacha20poly1305 = { version = "0.10", features = ["std"] } # encryption at rest.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] } # save local keys.

# Related to telecommunication.
libturms = { git = "https://github.com/TurmsApp/libturms" }
tokio = { version = "1", features = ["rt-multi-thread"] }
